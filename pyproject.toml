[project]
name = "voice2text"
version = "0.2.0"
description = "Offline speech-to-text desktop app (Whisper large-v3), with optional speaker labels."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Martin Bednář", email = "864920+xxBedy@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=19.0.2",
    "certifi>=2026.10.23",
    "faster-whisper>=1.2",
    "numpy>=2.5.4",
    "pyside6>=6.12",
    "sherpa-onnx>=2.0",
]

[project.urls]
Homepage = "https://github.com/xxBedy/Voice2Text"

[project.scripts]
voice2text = "voice2text.app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs a downloaded Whisper model (slow)"]
addopts = "-m 'not model'"
